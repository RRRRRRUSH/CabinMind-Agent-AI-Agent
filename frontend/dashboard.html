<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能座舱中控屏幕</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: #0a0a0a;
            color: #ffffff;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .dashboard-container {
            width: 100%;
            max-width: 1920px;
            height: 100vh;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 0;
            position: relative;
            overflow: hidden;
            box-shadow: 0 0 100px rgba(0, 150, 255, 0.3);
        }
        
        /* 顶部状态栏 */
        .status-bar {
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 150, 255, 0.3);
        }
        
        .car-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }
        
        .car-icon {
            font-size: 2rem;
            color: #00a8ff;
        }
        
        .car-model {
            font-size: 1.5rem;
            font-weight: 600;
            color: #ffffff;
        }
        
        .car-status {
            display: flex;
            gap: 30px;
        }
        
        .status-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }
        
        .status-label {
            font-size: 0.9rem;
            color: #888;
        }
        
        .status-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: #00a8ff;
        }
        
        .time-display {
            font-size: 1.5rem;
            font-weight: 300;
            color: #ffffff;
        }
        
        /* 主内容区域 */
        .main-content {
            display: grid;
            grid-template-columns: 2fr 1fr;
            height: calc(100vh - 80px);
            gap: 20px;
            padding: 20px;
        }
        
        /* 左侧：对话和地图区域 */
        .left-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* 地图区域 */
        .map-container {
            flex: 1;
            background: rgba(0, 20, 40, 0.8);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(0, 150, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        
        .map-title {
            font-size: 1.2rem;
            color: #00a8ff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .map-display {
            background: rgba(0, 30, 60, 0.6);
            height: calc(100% - 50px);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }
        
        .map-grid {
            position: absolute;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(0, 150, 255, 0.1) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 150, 255, 0.1) 1px, transparent 1px);
            background-size: 50px 50px;
        }
        
        .car-position {
            position: absolute;
            width: 40px;
            height: 40px;
            background: #00a8ff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 20px #00a8ff;
            animation: pulse 2s infinite;
        }
        
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(0, 168, 255, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(0, 168, 255, 0); }
            100% { box-shadow: 0 0 0 0 rgba(0, 168, 255, 0); }
        }
        
        .destination-marker {
            position: absolute;
            width: 30px;
            height: 30px;
            background: #ff6b6b;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 0 15px #ff6b6b;
        }
        
        /* 对话区域 */
        .chat-container {
            height: 300px;
            background: rgba(0, 20, 40, 0.8);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(0, 150, 255, 0.2);
            display: flex;
            flex-direction: column;
        }
        
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            margin-bottom: 15px;
            background: rgba(0, 30, 60, 0.4);
            border-radius: 10px;
        }
        
        .message {
            margin-bottom: 10px;
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 80%;
            line-height: 1.4;
            font-size: 0.95rem;
        }
        
        .user-message {
            background: linear-gradient(135deg, #00a8ff 0%, #0097e6 100%);
            margin-left: auto;
            border-bottom-right-radius: 3px;
        }
        
        .agent-message {
            background: rgba(255, 255, 255, 0.1);
            margin-right: auto;
            border-bottom-left-radius: 3px;
        }
        
        .message-time {
            font-size: 0.7rem;
            opacity: 0.7;
            margin-top: 3px;
        }
        
        .input-container {
            display: flex;
            gap: 10px;
        }
        
        .message-input {
            flex: 1;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(0, 150, 255, 0.3);
            border-radius: 8px;
            color: white;
            font-size: 1rem;
        }
        
        .message-input:focus {
            outline: none;
            border-color: #00a8ff;
            box-shadow: 0 0 10px rgba(0, 168, 255, 0.3);
        }
        
        .send-button {
            background: linear-gradient(135deg, #00a8ff 0%, #0097e6 100%);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .send-button:hover {
            background: linear-gradient(135deg, #0097e6 0%, #0088cc 100%);
            transform: translateY(-2px);
        }
        
        /* 右侧：控制面板 */
        .right-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        /* 控制卡片 */
        .control-card {
            background: rgba(0, 20, 40, 0.8);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(0, 150, 255, 0.2);
        }
        
        .card-title {
            font-size: 1.2rem;
            color: #00a8ff;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        /* 空调控制 */
        .climate-control {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }
        
        .control-item {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .control-label {
            font-size: 0.9rem;
            color: #888;
        }
        
        .control-value {
            font-size: 1.5rem;
            font-weight: 600;
            color: #00a8ff;
        }
        
        .control-slider {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 3px;
            outline: none;
            -webkit-appearance: none;
        }
        
        .control-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 20px;
            height: 20px;
            background: #00a8ff;
            border-radius: 50%;
            cursor: pointer;
        }
        
        /* 媒体控制 */
        .media-control {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .media-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .album-art {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
        }
        
        .track-info {
            flex: 1;
        }
        
        .track-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
        }
        
        .track-artist {
            font-size: 0.9rem;
            color: #888;
        }
        
        .media-buttons {
            display: flex;
            justify-content: space-around;
            gap: 10px;
        }
        
        .media-button {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            color: white;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .media-button:hover {
            background: rgba(0, 168, 255, 0.3);
            transform: scale(1.1);
        }
        
        /* 车窗控制 */
        .window-control {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }
        
        .window-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            transition: all 0.3s;
        }
        
        .window-item.active {
            background: rgba(0, 168, 255, 0.2);
            border: 1px solid rgba(0, 168, 255, 0.5);
        }
        
        .window-icon {
            font-size: 1.5rem;
            color: #00a8ff;
        }
        
        .window-status {
            font-size: 0.9rem;
            color: #888;
        }
        
        /* 识别状态 */
        .recognition-status {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .intent-display {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .intent-icon {
            width: 50px;
            height: 50px;
            background: rgba(0, 168, 255, 0.2);
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
        }
        
        .intent-info {
            flex: 1;
        }
        
        .intent-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: white;
        }
        
        .confidence-bar {
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            margin-top: 8px;
            overflow: hidden;
        }
        
        .confidence-fill {
            height: 100%;
            background: linear-gradient(90deg, #00a8ff 0%, #0097e6 100%);
            border-radius: 4px;
            transition: width 0.5s ease;
        }
        
        .confidence-text {
            font-size: 0.9rem;
            color: #888;
            text-align: right;
            margin-top: 5px;
        }
        
        /* 快捷命令 */
        .quick-commands {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        
        .quick-command {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(0, 150, 255, 0.2);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            font-size: 0.9rem;
            color: #ddd;
        }
        
        .quick-command:hover {
            background: rgba(0, 168, 255, 0.2);
            border-color: rgba(0, 168, 255, 0.5);
            transform: translateY(-2px);
        }
        
        /* 加载状态 */
        .loading {
            display: none;
            text-align: center;
            padding: 10px;
            color: #888;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #00a8ff;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: inline-block;
            margin-right: 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 168, 255, 0.5);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(0, 168, 255, 0.7);
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- 顶部状态栏 -->
        <div class="status-bar">
            <div class="car-info">
                <div class="car-icon">🚗</div>
                <div class="car-model">智能座舱 v1.0</div>
            </div>
            
            <div class="car-status">
                <div class="status-item">
                    <div class="status-label">电量</div>
                    <div class="status-value" id="batteryLevel">85%</div>
                </div>
                <div class="status-item">
                    <div class="status-label">里程</div>
                    <div class="status-value" id="mileage">256 km</div>
                </div>
                <div class="status-item">
                    <div class="status-label">温度</div>
                    <div class="status-value" id="outsideTemp">22°C</div>
                </div>
                <div class="status-item">
                    <div class="status-label">时间</div>
                    <div class="status-value" id="currentTime">10:08</div>
                </div>
            </div>
        </div>
        
        <!-- 主内容区域 -->
        <div class="main-content">
            <!-- 左侧面板 -->
            <div class="left-panel">
                <!-- 地图区域 -->
                <div class="map-container">
                    <div class="map-title">
                        <span>🗺️</span>
                        <span>实时导航</span>
                    </div>
                    <div class="map-display">
                        <div class="map-grid"></div>
                        <div class="car-position">🚗</div>
                        <div class="destination-marker" id="destinationMarker" style="display: none;">📍</div>
                    </div>
                </div>
                
                <!-- 对话区域 -->
                <div class="chat-container">
                    <div class="chat-messages" id="chatMessages">
                        <div class="message agent-message">
                            <div>您好！我是智能座舱助手，可以帮您控制空调、播放音乐、设置导航和操作车窗。</div>
                            <div class="message-time">系统启动</div>
                        </div>
                    </div>
                    
                    <div class="input-container">
                        <input type="text" 
                               class="message-input" 
                               id="messageInput" 
                               placeholder="对我说点什么，例如：把空调温度调到22度"
                               onkeypress="handleKeyPress(event)">
                        <button class="send-button" onclick="sendMessage()">发送</button>
                    </div>
                    
                    <div class="loading" id="loading">
                        <div class="spinner"></div>
                        正在处理您的指令...
                    </div>
                </div>
            </div>
            
            <!-- 右侧面板 -->
            <div class="right-panel">
                <!-- 空调控制 -->
                <div class="control-card">
                    <div class="card-title">
                        <span>🌡️</span>
                        <span>空调控制</span>
                    </div>
                    <div class="climate-control">
                        <div class="control-item">
                            <div class="control-label">温度</div>
                            <div class="control-value" id="climateTemp">22°C</div>
                            <input type="range" min="16" max="30" value="22" class="control-slider" id="tempSlider" oninput="updateClimateTemp(this.value)">
                        </div>
                        <div class="control-item">
                            <div class="control-label">模式</div>
                            <div class="control-value" id="climateMode">自动</div>
                            <div style="display: flex; gap: 10px; margin-top: 5px;">
                                <button class="media-button" onclick="setClimateMode('cool')">❄️</button>
                                <button class="media-button" onclick="setClimateMode('heat')">🔥</button>
                                <button class="media-button" onclick="setClimateMode('auto')">🔄</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 媒体控制 -->
                <div class="control-card">
                    <div class="card-title">
                        <span>🎵</span>
                        <span>媒体控制</span>
                    </div>
                    <div class="media-control">
                        <div class="media-info">
                            <div class="album-art">🎵</div>
                            <div class="track-info">
                                <div class="track-title" id="currentTrack">未播放</div>
                                <div class="track-artist" id="currentArtist">智能座舱音乐</div>
                            </div>
                        </div>
                        <div class="media-buttons">
                            <button class="media-button" onclick="mediaControl('prev')">⏮️</button>
                            <button class="media-button" onclick="mediaControl('play')" id="playButton">▶️</button>
                            <button class="media-button" onclick="mediaControl('pause')">⏸️</button>
                            <button class="media-button" onclick="mediaControl('next')">⏭️</button>
                            <button class="media-button" onclick="mediaControl('volup')">🔊</button>
                            <button class="media-button" onclick="mediaControl('voldown')">🔉</button>
                        </div>
                    </div>
                </div>
                
                <!-- 车窗控制 -->
                <div class="control-card">
                    <div class="card-title">
                        <span>🚗</span>
                        <span>车窗控制</span>
                    </div>
                    <div class="window-control">
                        <div class="window-item" id="windowDriver" onclick="toggleWindow('driver')">
                            <div class="window-icon">🚪</div>
                            <div class="window-status">驾驶座</div>
                            <div class="control-value" id="windowDriverStatus">关闭</div>
                        </div>
                        <div class="window-item" id="windowPassenger" onclick="toggleWindow('passenger')">
                            <div class="window-icon">🚪</div>
                            <div class="window-status">副驾驶</div>
                            <div class="control-value" id="windowPassengerStatus">关闭</div>
                        </div>
                        <div class="window-item" id="windowRearLeft" onclick="toggleWindow('rearLeft')">
                            <div class="window-icon">🚪</div>
                            <div class="window-status">左后</div>
                            <div class="control-value" id="windowRearLeftStatus">关闭</div>
                        </div>
                        <div class="window-item" id="windowRearRight" onclick="toggleWindow('rearRight')">
                            <div class="window-icon">🚪</div>
                            <div class="window-status">右后</div>
                            <div class="control-value" id="windowRearRightStatus">关闭</div>
                        </div>
                    </div>
                </div>
                
                <!-- 识别状态 -->
                <div class="control-card">
                    <div class="card-title">
                        <span>🤖</span>
                        <span>AI识别状态</span>
                    </div>
                    <div class="recognition-status">
                        <div class="intent-display">
                            <div class="intent-icon" id="intentIcon">🤔</div>
                            <div class="intent-info">
                                <div class="intent-name" id="intentName">等待识别</div>
                                <div class="confidence-bar">
                                    <div class="confidence-fill" id="confidenceBar" style="width: 0%"></div>
                                </div>
                                <div class="confidence-text">
                                    置信度: <span id="confidenceValue">0%</span>
                                </div>
                            </div>
                        </div>
                        <div class="quick-commands">
                            <div class="quick-command" onclick="useQuickCommand('把空调温度调到22度')">🌡️ 空调调温</div>
                            <div class="quick-command" onclick="useQuickCommand('播放周杰伦的音乐')">🎵 播放音乐</div>
                            <div class="quick-command" onclick="useQuickCommand('导航到北京天安门')">🗺️ 设置导航</div>
                            <div class="quick-command" onclick="useQuickCommand('打开驾驶座车窗')">🚗 打开车窗</div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 会话状态
        let sessionId = 'dashboard-session-' + Date.now();
        let conversationHistory = [];
        let currentDestination = null;
        
        // 更新当前时间
        function updateCurrentTime() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('zh-CN', { 
                hour: '2-digit', 
                minute: '2-digit'
            });
            document.getElementById('currentTime').textContent = timeString;
        }
        
        // 更新空调温度
        function updateClimateTemp(temp) {
            document.getElementById('climateTemp').textContent = temp + '°C';
        }
        
        // 设置空调模式
        function setClimateMode(mode) {
            const modeText = {
                'cool': '制冷',
                'heat': '制热', 
                'auto': '自动'
            }[mode] || '自动';
            document.getElementById('climateMode').textContent = modeText;
        }
        
        // 媒体控制
        function mediaControl(action) {
            const playButton = document.getElementById('playButton');
            const trackTitle = document.getElementById('currentTrack');
            const trackArtist = document.getElementById('currentArtist');
            
            switch(action) {
                case 'play':
                    playButton.textContent = '⏸️';
                    trackTitle.textContent = '七里香';
                    trackArtist.textContent = '周杰伦';
                    break;
                case 'pause':
                    playButton.textContent = '▶️';
                    break;
                case 'next':
                    trackTitle.textContent = '夜曲';
                    trackArtist.textContent = '周杰伦';
                    break;
                case 'prev':
                    trackTitle.textContent = '晴天';
                    trackArtist.textContent = '周杰伦';
                    break;
            }
        }
        
        // 车窗控制
        function toggleWindow(windowId) {
            const windowElement = document.getElementById('window' + windowId.charAt(0).toUpperCase() + windowId.slice(1));
            const statusElement = document.getElementById('window' + windowId.charAt(0).toUpperCase() + windowId.slice(1) + 'Status');
            
            if (statusElement.textContent === '关闭') {
                statusElement.textContent = '打开';
                windowElement.classList.add('active');
            } else {
                statusElement.textContent = '关闭';
                windowElement.classList.remove('active');
            }
        }
        
        // 发送消息
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const message = input.value.trim();
            
            if (!message) {
                return;
            }
            
            // 添加用户消息到聊天界面
            addMessageToChat(message, 'user');
            input.value = '';
            
            // 显示加载状态
            document.getElementById('loading').classList.add('active');
            
            try {
                // 构建请求数据
                const requestData = {
                    message: message,
                    sessionId: sessionId,
                    context: conversationHistory.slice(-3)
                };
                
                // 发送请求到Java后端
                const response = await fetch('http://localhost:8080/api/agent/process', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(requestData)
                });
                
                if (!response.ok) {
                    throw new Error(`HTTP错误! 状态码: ${response.status}`);
                }
                
                const result = await response.json();
                
                // 更新对话历史
                conversationHistory.push(message);
                
                // 添加Agent回复到聊天界面
                addMessageToChat(result.response || '指令已处理', 'agent');
                
                // 更新识别状态
                updateRecognitionStatus(result);
                
                // 根据意图更新UI
                handleIntentAction(result);
                
            } catch (error) {
                console.error('发送消息失败:', error);
                addMessageToChat('抱歉，处理您的指令时出现了问题。请检查系统连接。', 'agent');
            } finally {
                // 隐藏加载状态
                document.getElementById('loading').classList.remove('active');
            }
        }
        
        // 使用快捷命令
        function useQuickCommand(command) {
            document.getElementById('messageInput').value = command;
            sendMessage();
        }
        
        // 处理回车键
        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
        
        // 添加消息到聊天界面
        function addMessageToChat(message, sender) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${sender}-message`;
            
            const time = new Date().toLocaleTimeString('zh-CN', { 
                hour: '2-digit', 
                minute: '2-digit',
                second: '2-digit'
            });
            
            messageDiv.innerHTML = `
                <div>${message}</div>
                <div class="message-time">${time}</div>
            `;
            
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        
        // 更新识别状态
        function updateRecognitionStatus(result) {
            const intent = result.intent || 'unknown';
            const confidence = result.confidence || 0;
            
            // 更新意图图标和名称
            const intentIcons = {
                'climate_control': '🌡️',
                'media_control': '🎵',
                'navigation': '🗺️',
                'window_control': '🚗',
                'unknown': '🤔'
            };
            
            const intentNames = {
                'climate_control': '空调控制',
                'media_control': '媒体控制',
                'navigation': '导航控制',
                'window_control': '车窗控制',
                'unknown': '未知意图'
            };
            
            document.getElementById('intentIcon').textContent = intentIcons[intent] || '🤔';
            document.getElementById('intentName').textContent = intentNames[intent] || '未知意图';
            
            // 更新置信度
            const confidencePercent = Math.round(confidence * 100);
            document.getElementById('confidenceValue').textContent = `${confidencePercent}%`;
            document.getElementById('confidenceBar').style.width = `${confidencePercent}%`;
        }
        
        // 处理意图动作
        function handleIntentAction(result) {
            const intent = result.intent;
            const parameters = result.parameters || {};
            
            switch(intent) {
                case 'climate_control':
                    if (parameters.temperature) {
                        document.getElementById('climateTemp').textContent = parameters.temperature + '°C';
                        document.getElementById('tempSlider').value = parameters.temperature;
                    }
                    if (parameters.mode) {
                        setClimateMode(parameters.mode);
                    }
                    break;
                    
                case 'media_control':
                    if (parameters.artist || parameters.song) {
                        document.getElementById('currentTrack').textContent = parameters.song || '音乐';
                        document.getElementById('currentArtist').textContent = parameters.artist || '播放中';
                        mediaControl('play');
                    }
                    break;
                    
                case 'navigation':
                    if (parameters.destination) {
                        currentDestination = parameters.destination;
                        document.getElementById('destinationMarker').style.display = 'block';
                        addMessageToChat(`已设置导航目的地: ${parameters.destination}`, 'agent');
                    }
                    break;
                    
                case 'window_control':
                    if (parameters.window) {
                        const windowMap = {
                            'driver': 'Driver',
                            'passenger': 'Passenger',
                            'rear_left': 'RearLeft',
                            'rear_right': 'RearRight'
                        };
                        if (windowMap[parameters.window]) {
                            toggleWindow(parameters.window);
                        }
                    }
                    break;
            }
        }
        
        // 初始化
        window.onload = function() {
            // 更新时间
            updateCurrentTime();
            setInterval(updateCurrentTime, 60000);
            
            // 添加欢迎消息
            setTimeout(() => {
                addMessageToChat('欢迎使用智能座舱中控系统！', 'agent');
            }, 1000);
        };
    </script>
</body>
</html>
