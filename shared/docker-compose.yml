version: '3.8'

services:
  # Redis服务（用于上下文记忆）
  redis:
    image: redis:7-alpine
    container_name: smart-cabin-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - smart-cabin-network

  # Python AI服务
  python-ai-service:
    build:
      context: ../python-ai-service
      dockerfile: Dockerfile
    container_name: smart-cabin-python
    ports:
      - "5000:5000"
    environment:
      - PYTHON_SERVER_PORT=5000
      - PYTHON_SERVER_HOST=0.0.0.0
      - APP_ENVIRONMENT=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      # 注意：DEEPSEEK_API_KEY需要通过环境变量或secrets提供
      # - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
    volumes:
      - ../python-ai-service:/app
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - smart-cabin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Java后端服务
  java-backend:
    build:
      context: ../java-backend
      dockerfile: Dockerfile
    container_name: smart-cabin-java
    ports:
      - "8080:8080"
    environment:
      - JAVA_SERVER_PORT=8080
      - APP_ENVIRONMENT=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PYTHON_SERVER_URL=http://python-ai-service:5000
    volumes:
      - ../java-backend:/app
      - maven-repo:/root/.m2
    depends_on:
      redis:
        condition: service_healthy
      python-ai-service:
        condition: service_healthy
    networks:
      - smart-cabin-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/agent/health/simple"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx反向代理（可选）
  nginx:
    image: nginx:alpine
    container_name: smart-cabin-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ../frontend:/usr/share/nginx/html
    depends_on:
      - java-backend
      - python-ai-service
    networks:
      - smart-cabin-network

volumes:
  redis-data:
    driver: local
  maven-repo:
    driver: local

networks:
  smart-cabin-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16